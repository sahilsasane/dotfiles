dialect = "uk"
timezone = "local"

search_mode = "fuzzy"
filter_mode = "session"

style = "compact"
inline_height = 10
show_preview = true
max_preview_height = 6
show_help = false
show_tabs = false

enter_accept = true
exit_mode = "return-original"
keymap_mode = "auto"

auto_sync = true
sync_frequency = "3h"

cwd_filter = ["/private/", "/secrets/"]

[search]
filters = ["session", "host", "directory"]

[ui]
columns = ["duration", { type = "directory", width = 15 }, "command"]

[stats]
common_subcommands = ["git", "docker", "kubectl", "npm", "pnpm", "cargo", "uv"]
common_prefix = ["sudo"]
ignored_commands = ["cd", "ls", "ll", "pwd", "l", "gst", "g", "rl", "gl", "gf"]

[theme]
name = "sahil-latte"

[tmux]
enabled = true
width = "70%"
height = "50%"
