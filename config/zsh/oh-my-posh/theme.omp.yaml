$schema: https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
version: 3
final_space: true
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: os
        style: plain
        foreground: '#cdd6f4'
        template: '╭─ '
      - type: path
        style: plain
        foreground: '#fab387'
        properties:
          style: folder
      - type: git
        style: plain
        foreground: '#b4befe'
        foreground_templates:
          - '{{ if or (gt .Working.Unmerged 0) (gt .Staging.Unmerged 0) }}#f38ba8{{ end }}'
          - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#fab387{{ end }}'
          - '{{ if or .Working.Changed .Staging.Changed }}#f9e2af{{ end }}'
          - '{{ if gt .Behind 0 }}#89dceb{{ end }}'
          - '{{ if gt .Ahead 0 }}#a6e3a1{{ end }}'
        template: |-
           <i>{{ .HEAD }}</i>
          {{- if gt .Behind 0 -}}
            {{ " " }}<#f9e2af>⇣{{ .Behind }}</>
          {{- end -}}
          {{- if gt .Ahead 0 -}}
            {{ " " }}<#fab387>⇡{{ .Ahead }}</>
          {{- end -}}
          {{- if gt .PushBehind 0 -}}
            {{ " " }}<#f2cdcd>⇠{{ .PushBehind }}</>
          {{- end -}}
          {{- if gt .PushAhead 0 -}}
            {{ " " }}<#f5c2e7>⇢{{ .PushAhead }}</>
          {{- end -}}
          {{- if .UpstreamGone -}}
            {{ " " }}<#f38ba8></>
          {{- end -}}
          {{- if .Merge -}}
            {{ " " }}<#eba0ac></>
          {{- end -}}
          {{- if .Rebase -}}
            {{ " " }}<#fab387>{{ .Rebase.Current }}/{{ .Rebase.Total }}</>
          {{- end -}}
          {{- if .CherryPick -}}
            {{ " " }}<#f5c2e7></>
          {{- end -}}
          {{- if .Revert -}}
            {{ " " }}<#f2cdcd>↶</>
          {{- end -}}
          {{- if gt .StashCount 0 -}}
            {{ " " }}<#f5e0dc>{{ .StashCount }}</>
          {{- end -}}
          {{- if .Working.Changed -}}
            {{ " " }}<#f38ba8> {{ .Working.String }}</>
          {{- end -}}
          {{- if .Staging.Changed -}}
            {{ " " }}<#f9e2af> {{ .Staging.String }}</>
          {{- end -}}
          {{ " " }}
        properties:
          branch_icon: ""
          fetch_status: true
          fetch_push_status: true
          status_formats:
            Unmerged: %d
            Added: +%d
            Modified: ~%d
            Deleted: -%d
            Untracked: ?%d
  - type: prompt
    alignment: right
    segments:
      - type: docker
        style: plain
        foreground: '#89b4fa'
        template: |-
          {{- if .Containers -}}
             <#94e2d5>
            {{- range $i, $container := .Containers -}}
              {{- if lt $i 3 -}}
                {{- if $i -}}
                  {{ " " }}·{{ " " }}
                {{- end -}}
                {{ regexReplaceAll "^.+[-_]([^_-]+)[-_][0-9]+$" $container.Names "${1}" }}
              {{- end -}}
            {{- end -}}
            {{- if gt (len .Containers) 3 -}}
              {{ " " }}+{{ sub (len .Containers) 3 }}
            {{- end -}}
            </>{{ " " }}
          {{- end -}}
        properties:
          display_mode: environment
      - type: python
        style: plain
        foreground: '#89b4fa'
        # shortcut: ownership compares paths; canonicalize aliases if symlinks cause false warnings.
        template: |-
          {{- $name := .Venv -}}
          {{- $foreign := false -}}
          {{- if .Env.VIRTUAL_ENV -}}
            {{- $venv := clean .Env.VIRTUAL_ENV -}}
            {{- $name = base $venv -}}
            {{- $project := dir $venv -}}
            {{- $location := clean .AbsolutePWD -}}
            {{- if .Segments.Contains "Git" -}}
              {{- $project = .Segments.Git.Dir -}}
              {{- $location = $venv -}}
              {{- if eq $project "~" -}}
                {{- $project = .Env.HOME -}}
              {{- else if hasPrefix "~/" $project -}}
                {{- $project = printf "%s/%s" .Env.HOME (trimPrefix "~/" $project) -}}
              {{- end -}}
            {{- end -}}
            {{- $foreign = not (hasPrefix
              (printf "%s/" (trimSuffix "/" (clean $project)))
              (printf "%s/" (trimSuffix "/" $location))
            ) -}}
          {{- end -}}
          {{- if and (.Segments.Contains "Docker") .Segments.Docker.Containers -}}
            {{ " " }}<#585b70>│</>{{ "  " }}
          {{- end -}}
           <#cba6f7>{{ $name }}</>
          {{- if and .Major .Minor -}}
            <#a6adc8> · {{ .Major }}.{{ .Minor }}</>
          {{- end -}}
          {{- if $foreign -}}
            {{ " " }}<#f9e2af></>
          {{- end -}}
          {{ " " }}
        properties:
          display_mode: environment
          fetch_version: true
          tooling:
            - python
            - python3
          fetch_virtual_env: true
          folder_name_fallback: false
          display_default: false
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: text
        style: plain
        foreground: '#ffffff'
        template: '╰─>'
