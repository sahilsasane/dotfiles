# General settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:ccolour:cstyle:focus:hyperlinks:osc7:title:progressbar"
set -as terminal-features ",xterm-kitty:RGB:clipboard:ccolour:cstyle:focus:hyperlinks:osc7:title"
set -as terminal-overrides ",xterm-ghostty:Ss=\\E[%p1%d q:Se=\\E[6 q"
set -as terminal-overrides ",xterm-kitty:Ss=\\E[%p1%d q:Se=\\E[6 q"
set -g mouse on
set -g focus-events on
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"
set -g allow-passthrough all
set -g allow-rename off
# Name the terminal window after the session, not the command that attached it
set -g set-titles on
set -g set-titles-string "#S"
set -g history-limit 100000
set -sg escape-time 10
set -g remain-on-exit off

# Beam at the shell, block in copy mode
set -g cursor-style bar
set-hook -g pane-mode-changed "if -F '#{pane_in_mode}' 'set -p cursor-style block' 'set -p cursor-style bar'"
# Quick escape hatch: disable tmux mouse temporarily when you want native terminal selection.
bind m if-shell -F '#{mouse}' 'set -g mouse off \; display-message "tmux mouse: off"' 'set -g mouse on \; display-message "tmux mouse: on"'

# Prefix keys
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix -2

# Start numbering at 1 and keep windows compact.
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
bind -Tcopy-mode MouseDragEnd1Pane send -X copy-selection-no-clear
bind -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -Tcopy-mode-vi v send -X begin-selection
bind -Tcopy-mode-vi C-v send -X rectangle-toggle
bind -Tcopy-mode-vi y send -X copy-selection-and-cancel

# Pane and window navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 7
bind -r J resize-pane -D 7
bind -r K resize-pane -U 7
bind -r L resize-pane -R 7
bind Tab last-window
bind -n M-h previous-window
bind -n M-l next-window
bind g switch-client -l
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4

# Splits and new windows inherit the current pane directory.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Quality-of-life bindings
# Claude's Stop hook does not fire on keyboard interruption; forward the key and clear its progress.
bind -n Escape send-keys Escape \; if-shell -F '#{@dotfiles_claude_progress}' 'set-option -pu @dotfiles_claude_progress' \; if-shell -F '#{@agent_phase}' 'set-option -pu @agent_phase'
bind -n C-c send-keys C-c \; if-shell -F '#{@dotfiles_claude_progress}' 'set-option -pu @dotfiles_claude_progress' \; if-shell -F '#{@agent_phase}' 'set-option -pu @agent_phase'
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind R run-shell 'bash /Users/sahilsasane/dotfiles/tmux/scripts/record-pane.sh #{q:pane_id}'
bind b set-option status \; display-message "status toggled"
bind e choose-tree -Zw
bind y if-shell -F '#{pane_synchronized}' 'set-window-option synchronize-panes off' 'set-window-option synchronize-panes on'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'spywhere/tmux-named-snapshot'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'AndreVicencio/tmux-flash'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Toggle a persistent floating shell with the existing popup key.
set -g @floax-bind 'P'
set -g @floax-bind-menu 'M'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-change-path 'true'

# SessionX: switch, create, rename, or delete sessions from one picker.
set -g @sessionx-bind 'f'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filtered-sessions 'scratch'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '60%'

# Keep prefix + Tab for last-window; extrakto's default is prefix + Tab.
set -g @extrakto_key 'C-e'
# Let Extrakto inherit the theme's fzf colors instead of clearing them.
set -g @extrakto_fzf_unset_default_opts 'false'

# Initialize TPM before the runtime theme so Catppuccin cannot overwrite the
# custom transparent status and window formats selected by dotfiles-theme.
run '~/.tmux/plugins/tpm/tpm'

# Theme and status line: use the installed runtime selector, with dark as a
# safe fallback while the installer has not yet created it.
set -g status-left-length 48
set -g status-right-length 240
set -g window-status-separator ""
set -g window-status-format " #I "
if-shell 'test -f ~/.config/dotfiles-theme/tmux.conf' 'source-file ~/.config/dotfiles-theme/tmux.conf' 'source-file /Users/sahilsasane/dotfiles/tmux/themes/dark.conf'
# The theme replaces status-right, so reattach Continuum's periodic save trigger.
if-shell 'test -x ~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh' 'set -gF status-right "##(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{status-right}"'
set -gF status-right "##(python3 /Users/sahilsasane/dotfiles/tmux/scripts/agent-status.py)#{status-right}"
set -gF popup-style "#{@dotfiles_popup_style}"
set -gF popup-border-style "#{@dotfiles_popup_border_style}"
set -g status-interval 10
